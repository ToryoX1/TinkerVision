<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV — CAD · 3D · Design</title>
  <meta name="description" content="CAD-3D-Entwicklung, digitale Produkte, 3D-Scan, Prototypen und Design.">
  <link rel="icon" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">
  <meta property="og:title" content="TV — CAD · 3D · Design">
  <meta property="og:description" content="CAD-3D-Entwicklung, digitale Produkte, 3D-Scan, Prototypen und Design.">
  <meta property="og:image" content="Website_Logo_v1.png">
  <style>
    :root {
      --ink: #111;
      --muted: #5a5a5a;
      --line: #e6e6e6;
      --bg: #fafafa;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    main {
      width: min(440px, calc(100% - 32px));
      margin: 56px auto 32px;
      text-align: center;
    }
    .logo {
      width: 168px;
      height: 168px;
      object-fit: contain;
      display: block;
      margin: 0 auto 28px;
    }
    h1 {
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      margin: 0 0 8px;
      font-weight: 700;
    }
    .tag {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
      margin: 0 0 28px;
    }
    nav { display: grid; gap: 10px; }
    a.btn {
      display: block;
      padding: 14px 16px;
      border: 1.5px solid var(--ink);
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: #fff;
    }
    a.btn:hover { background: var(--ink); color: #fff; }
    a.btn.ghost {
      border-color: var(--line);
      color: var(--muted);
      font-weight: 500;
    }
    a.btn.ghost:hover { border-color: var(--ink); color: #fff; background: var(--ink); }
    footer {
      margin-top: auto;
      padding: 24px 16px 32px;
      color: var(--muted);
      font-size: 0.8rem;
      display: flex;
      gap: 16px;
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="Website_Logo_v1.png" alt="TV Logo — T über Zeichenzirkel">
    <h1>TV</h1>
    <p class="tag">CAD-3D-Entwicklung · Vertrieb digitaler Produkte<br>3D-Scan · Prototypen · Design</p>
    <nav>
      <!-- Eigene Shop-URLs hier einsetzen -->
      <a class="btn" href="https://www.etsy.com/" rel="noopener">Shop</a>
      <a class="btn" href="mailto:kontakt@example.com">Kontakt</a>
      <a class="btn ghost" href="impressum.html">Impressum</a>
      <a class="btn ghost" href="datenschutz.html">Datenschutz</a>
    </nav>
  </main>
  <footer>
    <span>© 2026</span>
  </footer>
</body>
</html>
