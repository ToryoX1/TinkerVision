<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinkerVision</title>
  <meta name="description" content="TinkerVision — CAD, 3D, Design.">
  <link rel="icon" href="emblem.png">
  <link rel="apple-touch-icon" href="emblem.png">
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=orbitron:700|outfit:400,500,600" rel="stylesheet">
  <meta property="og:title" content="TinkerVision">
  <meta property="og:description" content="Ideas become geometry.">
  <meta property="og:image" content="emblem.png">
  <style>
    :root {
      --ink: #101114;
      --muted: #6d6f78;
      --line: #e4e5ea;
      --bg0: #ececf1;
      --cults: #6b2d91;
      --printables: #fa6831;
      --contact: #101114;
      --services: #2f4a63;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--bg0);
      background-image:
        radial-gradient(ellipse 70% 45% at 50% 0%, #ffffff 0%, transparent 70%),
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: auto, 28px 28px, 28px 28px;
    }
    .top {
      width: min(520px, calc(100% - 28px));
      display: flex;
      justify-content: flex-end;
      padding: 16px 0 0;
    }
    .lang {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(8px);
    }
    .lang button {
      font-family: Outfit, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      font-weight: 600;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 12px;
      cursor: pointer;
    }
    .lang button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }
    main {
      width: min(520px, calc(100% - 28px));
      margin: 14px auto 28px;
      text-align: center;
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(14px);
      border: 1px solid #fff;
      border-radius: 28px;
      padding: 36px 22px 22px;
      box-shadow:
        0 1px 0 rgba(255,255,255,.9) inset,
        0 24px 50px rgba(16,17,20,.08);
    }
    .logo {
      width: 140px;
      height: 140px;
      object-fit: contain;
      display: block;
      margin: 0 auto 18px;
      filter: drop-shadow(0 10px 20px rgba(16,17,20,.08));
    }
    h1 {
      font-family: Orbitron, sans-serif;
      font-size: 1.18rem;
      letter-spacing: 0.24em;
      margin: 0 0 8px;
      font-weight: 700;
    }
    .tag {
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      margin: 0;
    }
    .rule {
      width: 28px;
      height: 2px;
      background: var(--ink);
      margin: 28px auto 22px;
      opacity: .22;
      border-radius: 2px;
    }
    .line {
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      margin: 0;
      text-transform: none;
    }
    .line2 {
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      margin: 8px 0 36px;
    }
    .shops { display: grid; gap: 10px; }
    a.shop {
      display: grid;
      grid-template-columns: 48px 1fr 16px;
      gap: 12px;
      align-items: center;
      text-align: left;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      text-decoration: none;
      color: var(--ink);
      box-shadow: 0 6px 16px rgba(16,17,20,.04);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    a.shop:hover {
      transform: translateY(-2px);
      border-color: #d0d1d8;
      box-shadow: 0 14px 28px rgba(16,17,20,.08);
    }
    .cults { border-left: 3px solid var(--cults); }
    .printables { border-left: 3px solid var(--printables); }
    .services-btn { border-left: 3px solid var(--services); }
    .contact-btn { border-left: 3px solid var(--contact); }
    .mark {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #fff;
    }
    .mark svg { width: 22px; height: 22px; fill: currentColor; }
    .cults .mark { background: var(--cults); }
    .printables .mark { background: var(--printables); }
    .services-btn .mark { background: var(--services); }
    .contact-btn .mark { background: var(--contact); }
    .shop strong {
      display: block;
      font-size: 0.98rem;
      font-weight: 600;
    }
    .shop span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      margin-top: 2px;
    }
    .ext { color: #c4c5cc; }
    footer {
      margin-top: 28vh;
      padding: 48px 16px 36px;
      color: var(--muted);
      font-size: 0.75rem;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--ink); }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 22px;
    }
    .stats div {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 10px 12px;
      text-align: center;
    }
    .stats strong {
      font-family: Orbitron, sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.06em;
    }
    .stats em {
      font-style: normal;
      font-family: Orbitron, sans-serif;
      font-size: 1.15rem;
    }
    .stats p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }
    @media (min-width: 900px) {
      .top, main { width: min(640px, calc(100% - 48px)); }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-set-lang="de" aria-pressed="true">DE</button>
      <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <main>
    <img class="logo" src="emblem.png" alt="TinkerVision">
    <h1>TinkerVision</h1>
    <p class="tag" data-i18n="slogan"></p>
    <div class="rule" aria-hidden="true"></div>
    <p class="line" data-i18n="line"></p>
    <p class="line2" data-i18n="line2"></p>
    <nav class="shops" aria-label="Shops">
      <a class="shop services-btn" href="leistungen.html">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 3.5 2.2 2.2L20 14l-1.4-1.4-3.4 3.4-1-1L13 16.5z"/></svg>
        </div>
        <div>
          <strong data-i18n="services"></strong>
          <span data-i18n="servicesSub"></span>
        </div>
        <svg class="ext" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 6l6 6-6 6-1.4-1.4L13.2 12 8.6 7.4 10 6z"/></svg>
      </a>
      <a class="shop contact-btn" href="kontakt.html">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3V5zm2 2v.2l7 4.6 7-4.6V7H5zm14 10V10.1l-7 4.6-7-4.6V17h14z"/></svg>
        </div>
        <div>
          <strong data-i18n="contact"></strong>
          <span data-i18n="contactSub"></span>
        </div>
        <svg class="ext" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 6l6 6-6 6-1.4-1.4L13.2 12 8.6 7.4 10 6z"/></svg>
      </a>
      <a class="shop cults" href="https://cults3d.com/@TinkerVision" rel="noopener noreferrer" target="_blank">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.2 6.2 3.45v.2L12 11.3 5.8 7.85v-.2L12 4.2zM5 9.2l6 3.35V19l-6-3.33V9.2zm8 9.15v-6.45L19 9.2v6.47L13 18.35z"/></svg>
        </div>
        <div>
          <strong>Cults3D</strong>
          <span data-i18n="cults"></span>
        </div>
        <svg class="ext" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>
      </a>
      <a class="shop printables" href="https://www.printables.com/@TinkerVision_2450000" rel="noopener noreferrer" target="_blank">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 3h16v4H4V3zm2 6h12l1 12H5L6 9zm4 2v8h4v-8h-4z"/></svg>
        </div>
        <div>
          <strong>Printables</strong>
          <span data-i18n="printables"></span>
        </div>
        <svg class="ext" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>
      </a>
    </nav>
    <div class="stats">
      <div>
        <strong id="stat-dl">0</strong><em>+</em>
        <p data-i18n="statDl"></p>
      </div>
      <div>
        <strong id="stat-cad">0</strong><em>+</em>
        <p data-i18n="statCad"></p>
      </div>
    </div>
  </main>
  <footer>
    <span>© 2026 TinkerVision</span>
    <a href="impressum.html" data-i18n="imprint"></a>
    <a href="datenschutz.html" data-i18n="privacy"></a>
  </footer>
  <script>
    const T = {
      de: {
        slogan: "Idee wird Geometrie.",
        line: "3D-Scan · CAD-Konstruktion · FEM-Analyse",
        line2: "Vom Prototypen bis zur Sonderanfertigung",
        cults: "Öffentliches Premium-Portfolio",
        printables: "Öffentliches Freemium-Portfolio",
        imprint: "Impressum",
        privacy: "Datenschutz",
        contact: "Kontakt",
        contactSub: "Den besten Weg zur Kontaktaufnahme finden",
        services: "Leistungen",
        servicesSub: "Scan, Konstruktion, Analyse, Sonderanfertigungen",
        statDl: "Digitale Downloads",
        statCad: "Konstruktionen erstellt"
      },
      en: {
        slogan: "Ideas become geometry.",
        line: "3D scan · CAD design · FEA",
        line2: "From prototype to custom one-off",
        cults: "Public premium portfolio",
        printables: "Public freemium portfolio",
        imprint: "Imprint",
        privacy: "Privacy",
        contact: "Contact",
        contactSub: "Find the best way to get in touch",
        services: "Services",
        servicesSub: "Scan, design, analysis, custom parts",
        statDl: "Digital downloads",
        statCad: "Designs completed"
      }
    };
    function applyLang(lang) {
      const pack = T[lang] || T.de;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (pack[key]) el.textContent = pack[key];
      });
      document.querySelectorAll("[data-set-lang]").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.getAttribute("data-set-lang") === lang ? "true" : "false");
      });
      localStorage.setItem("tv-lang", lang);
    }
    const start = localStorage.getItem("tv-lang") || (navigator.language || "de").slice(0, 2);
    applyLang(start === "en" ? "en" : "de");
    document.querySelectorAll("[data-set-lang]").forEach((btn) => {
      btn.addEventListener("click", () => applyLang(btn.getAttribute("data-set-lang")));
    });
    function countUp(el, to, ms) {
      const start = performance.now();
      function tick(now) {
        const t = Math.min(1, (now - start) / ms);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = String(Math.round(to * eased));
        if (t < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }
    countUp(document.getElementById("stat-dl"), 1420, 1400);
    countUp(document.getElementById("stat-cad"), 200, 1400);
  </script>
</body>
</html>
