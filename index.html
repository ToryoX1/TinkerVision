<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinkerVision — CAD · 3D · Design</title>
  <meta name="description" content="CAD-3D-Entwicklung, digitale Produkte, 3D-Scan, Prototypen und Design. Modelle auf Cults3D und Printables.">
  <link rel="icon" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">
  <meta property="og:title" content="TinkerVision — CAD · 3D · Design">
  <meta property="og:description" content="3D-Modelle und digitale Konstruktionen. Shops auf Cults3D und Printables.">
  <meta property="og:image" content="logo.jpg">
  <style>
    :root {
      --ink: #111111;
      --muted: #5c5c5c;
      --line: #e4e4e4;
      --bg: #f4f4f2;
      --card: #ffffff;
      --cults: #e85d04;
      --printables: #fa6831;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 50% -10%, #ffffff 0%, var(--bg) 55%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    main {
      width: min(420px, calc(100% - 32px));
      margin: 48px auto 24px;
      text-align: center;
    }
    .logo {
      width: 148px;
      height: 148px;
      object-fit: contain;
      display: block;
      margin: 0 auto 22px;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.06));
    }
    h1 {
      font-size: 1.45rem;
      letter-spacing: 0.14em;
      margin: 0 0 8px;
      font-weight: 750;
      text-transform: uppercase;
    }
    .tag {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
      margin: 0 0 28px;
    }
    .section {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 10px;
      font-weight: 600;
    }
    .shops { display: grid; gap: 12px; margin-bottom: 28px; }
    a.shop {
      display: grid;
      grid-template-columns: 52px 1fr 18px;
      gap: 12px;
      align-items: center;
      text-align: left;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      text-decoration: none;
      color: var(--ink);
      box-shadow: 0 6px 18px rgba(0,0,0,.04);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    a.shop:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0,0,0,.08);
      border-color: #cfcfcf;
    }
    .mark {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #fff;
    }
    .mark svg { width: 26px; height: 26px; fill: currentColor; }
    .cults .mark { background: var(--cults); }
    .printables .mark { background: var(--printables); }
    .shop strong {
      display: block;
      font-size: 1.02rem;
      letter-spacing: 0.01em;
    }
    .shop span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 2px;
    }
    .ext { color: #b0b0b0; }
    footer {
      margin-top: auto;
      padding: 8px 16px 32px;
      color: var(--muted);
      font-size: 0.8rem;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.jpg" alt="TinkerVision Logo — T über Zeichenzirkel">
    <h1>TinkerVision</h1>
    <p class="tag">CAD-3D-Entwicklung · digitale Produkte<br>3D-Scan · Prototypen · Design</p>

    <p class="section">Shops &amp; Modelle</p>
    <nav class="shops" aria-label="3D-Shops">
      <a class="shop cults" href="https://cults3d.com/@TinkerVision" rel="noopener noreferrer" target="_blank">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.2 6.2 3.45v.2L12 11.3 5.8 7.85v-.2L12 4.2zM5 9.2l6 3.35V19l-6-3.33V9.2zm8 9.15v-6.45L19 9.2v6.47L13 18.35z"/></svg>
        </div>
        <div>
          <strong>Cults3D</strong>
          <span>3D-Modelle zum Download</span>
        </div>
        <svg class="ext" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>
      </a>

      <a class="shop printables" href="https://www.printables.com/@TinkerVision_2450000" rel="noopener noreferrer" target="_blank">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 3h16v4H4V3zm2 6h12l1 12H5L6 9zm4 2v8h4v-8h-4z"/></svg>
        </div>
        <div>
          <strong>Printables</strong>
          <span>Kostenlose &amp; Premium-Modelle</span>
        </div>
        <svg class="ext" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>
      </a>
    </nav>
  </main>
  <footer>
    <span>© 2026 TinkerVision</span>
    <a href="impressum.html">Impressum</a>
    <a href="datenschutz.html">Datenschutz</a>
  </footer>
</body>
</html>
