<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinkerVision — Leistungen</title>
  <link rel="icon" href="emblem.png">
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=orbitron:700|outfit:400,500,600" rel="stylesheet">
  <style>
    :root {
      --ink: #101114;
      --muted: #6d6f78;
      --line: #e4e5ea;
      --bg0: #ececf1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--bg0);
      background-image:
        radial-gradient(ellipse 70% 45% at 50% 0%, #ffffff 0%, transparent 70%),
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: auto, 28px 28px, 28px 28px;
    }
    .top {
      width: min(440px, calc(100% - 28px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 0;
    }
    .back { color: var(--muted); text-decoration: none; font-size: 0.88rem; }
    .back:hover { color: var(--ink); }
    .lang {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.86);
    }
    .lang button {
      font-family: Outfit, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      font-weight: 600;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 12px;
      cursor: pointer;
    }
    .lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    main {
      width: min(440px, calc(100% - 28px));
      margin: 14px auto 28px;
      background: rgba(255,255,255,.78);
      border: 1px solid #fff;
      border-radius: 28px;
      padding: 28px 22px 22px;
      box-shadow: 0 24px 50px rgba(16,17,20,.08);
    }
    h1 {
      font-family: Orbitron, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      margin: 0 0 6px;
    }
    .lead { color: var(--muted); font-size: 0.88rem; margin: 0 0 18px; }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }
    li {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px 12px 16px;
      line-height: 1.45;
      font-size: 0.92rem;
    }
    .cta {
      display: block;
      margin-top: 18px;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
      background: var(--ink);
      color: #fff;
      border-radius: 12px;
      padding: 12px 14px;
    }
    footer {
      margin-top: auto;
      padding: 4px 16px 28px;
      color: var(--muted);
      font-size: 0.75rem;
      display: flex;
      gap: 14px;
      justify-content: center;
    }
    footer a { color: var(--muted); text-decoration: none; }
  </style>
</head>
<body>
  <div class="top">
    <a class="back" href="index.html" data-i18n="back"></a>
    <div class="lang" role="group">
      <button type="button" data-set-lang="de" aria-pressed="true">DE</button>
      <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <main>
    <h1 data-i18n="title"></h1>
    <p class="lead" data-i18n="lead"></p>
    <ul>
      <li data-i18n="b1"></li>
      <li data-i18n="b2"></li>
      <li data-i18n="b3"></li>
      <li data-i18n="b4"></li>
    </ul>
    <a class="cta" href="kontakt.html" data-i18n="cta"></a>
  </main>
  <footer>
    <a href="impressum.html" data-i18n="imprint"></a>
    <a href="datenschutz.html" data-i18n="privacy"></a>
  </footer>
  <script>
    const T = {
      de: {
        back: "← Zurück",
        title: "Leistungen",
        lead: "Von der Zeichnung bis zum Teil.",
        b1: "Technische Zeichnungen",
        b2: "3D-Scans",
        b3: "Parametrische 3D-Dateien in gängigen Formaten — für 3D-Druck (FDM, SLA), CNC und Lasergravur",
        b4: "Anfertigung vom Prototyp bis zum fertigen Produkt",
        cta: "Anfrage senden",
        imprint: "Impressum",
        privacy: "Datenschutz"
      },
      en: {
        back: "← Back",
        title: "Services",
        lead: "From drawing to part.",
        b1: "Technical drawings",
        b2: "3D scans",
        b3: "Parametric 3D files in common formats — for 3D printing (FDM, SLA), CNC and laser engraving",
        b4: "From prototype through to the finished product",
        cta: "Send an enquiry",
        imprint: "Imprint",
        privacy: "Privacy"
      }
    };
    function applyLang(lang) {
      const pack = T[lang] || T.de;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (pack[key]) el.textContent = pack[key];
      });
      document.querySelectorAll("[data-set-lang]").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.getAttribute("data-set-lang") === lang ? "true" : "false");
      });
      localStorage.setItem("tv-lang", lang);
    }
    const start = localStorage.getItem("tv-lang") || (navigator.language || "de").slice(0, 2);
    applyLang(start === "en" ? "en" : "de");
    document.querySelectorAll("[data-set-lang]").forEach((btn) => {
      btn.addEventListener("click", () => applyLang(btn.getAttribute("data-set-lang")));
    });
  </script>
</body>
</html>
