<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinkerVision — Leistungen</title>
  <link rel="icon" href="emblem.png">
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=orbitron:700|outfit:400,500,600" rel="stylesheet">
  <style>
    :root {
      --ink: #101114;
      --muted: #6d6f78;
      --line: #e4e5ea;
      --bg0: #ececf1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--bg0);
      background-image:
        radial-gradient(ellipse 70% 45% at 50% 0%, #ffffff 0%, transparent 70%),
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: auto, 28px 28px, 28px 28px;
    }
    .top {
      width: min(520px, calc(100% - 28px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 0;
    }
    .back { color: var(--muted); text-decoration: none; font-size: 0.88rem; }
    .back:hover { color: var(--ink); }
    .lang {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.86);
    }
    .lang button {
      font-family: Outfit, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      font-weight: 600;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 12px;
      cursor: pointer;
    }
    .lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    main {
      width: min(520px, calc(100% - 28px));
      margin: 14px auto 28px;
      background: rgba(255,255,255,.78);
      border: 1px solid #fff;
      border-radius: 28px;
      padding: 28px 22px 22px;
      box-shadow: 0 24px 50px rgba(16,17,20,.08);
    }
    .brand {
      font-family: Orbitron, sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.24em;
      font-weight: 700;
      margin: 0 0 10px;
      text-align: center;
    }
    h1 {
      font-family: Orbitron, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.16em;
      margin: 0 0 6px;
      text-align: center;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 0 0 18px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px;
    }
    .tabs button {
      font-family: Outfit, sans-serif;
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      border: 0;
      border-radius: 9px;
      padding: 9px 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .tabs button[aria-selected="true"] {
      background: var(--ink);
      color: #fff;
    }
    .panel[hidden] { display: none; }
    .lead { color: var(--muted); font-size: 0.9rem; line-height: 1.5; margin: 0 0 22px; }
    h2 {
      font-family: Orbitron, sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      margin: 0 0 6px;
      color: var(--ink);
    }
    article {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: stretch;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    article:nth-of-type(even) {
      grid-template-columns: 1fr auto;
    }
    article:nth-of-type(even) img { order: 2; }
    article img {
      height: 100%;
      width: auto;
      max-width: 46%;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      background: #eef0f3;
    }
    article .copy { min-width: 0; }
    article p { margin: 0; font-size: 0.9rem; line-height: 1.5; }
    @media (max-width: 420px) {
      article,
      article:nth-of-type(even) { grid-template-columns: 1fr; }
      article:nth-of-type(even) img { order: 0; }
      article img { width: 100%; max-width: none; height: auto; }
    }
    .meta {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .faq { margin-top: 22px; }
    .faq h2 { margin-bottom: 10px; }
    details {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
    }
    summary .mat-name { display: block; }
    summary .mat-note {
      display: block;
      font-weight: 400;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
      margin-top: 4px;
    }
    details p { margin: 8px 0 2px; font-size: 0.86rem; line-height: 1.5; color: var(--muted); }
    .swatch {
      position: relative;
      width: min(240px, 80%);
      margin: 12px auto 14px;
      background: transparent;
    }
    .swatch .fill {
      position: absolute;
      inset: 0;
      background: #EFF0F1;
      -webkit-mask-image: url("filamente/filament_mask.png");
      mask-image: url("filamente/filament_mask.png");
      -webkit-mask-size: 104%;
      mask-size: 104%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }
    .swatch img {
      display: block;
      width: 100%;
      height: auto;
      position: relative;
      z-index: 1;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 6px;
    }
    .chips button {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(16,17,20,.2);
      padding: 0;
      cursor: pointer;
    }
    .chips button[aria-pressed="true"] {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }
    .chips button.translucent {
      background:
        linear-gradient(180deg, rgba(255,127,50,.72), rgba(255,160,80,.38)),
        repeating-conic-gradient(#d9d9d9 0 25%, #fff 0 50%) 0 0 / 8px 8px;
    }
    .chips button.gloss {
      background: radial-gradient(circle at 32% 28%, #5a5a5a 0%, #111 58%, #000 100%);
    }
    .chips button.marble {
      background:
        radial-gradient(ellipse at 20% 30%, #fff 0 12%, transparent 28%),
        radial-gradient(ellipse at 70% 60%, #cfc8be 0 10%, transparent 26%),
        linear-gradient(115deg, #f3f0ea 0%, #d9d4cb 38%, #efece6 52%, #c5bfb4 78%, #f7f5f1 100%);
    }
    .color-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .cta {
      display: block;
      margin-top: 18px;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
      background: var(--ink);
      color: #fff;
      border-radius: 12px;
      padding: 12px 14px;
    }
    footer {
      margin-top: auto;
      padding: 4px 16px 28px;
      color: var(--muted);
      font-size: 0.75rem;
      display: flex;
      gap: 14px;
      justify-content: center;
    }
    footer a { color: var(--muted); text-decoration: none; }
  </style>
</head>
<body>
  <div class="top">
    <a class="back" href="index.html" data-i18n="back"></a>
    <div class="lang" role="group">
      <button type="button" data-set-lang="de" aria-pressed="true">DE</button>
      <button type="button" data-set-lang="en" aria-pressed="false">EN</button>

  <main>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-svc" aria-selected="true" aria-controls="panel-svc" data-tab="svc" data-i18n="tabSvc"></button>
      <button type="button" role="tab" id="tab-mat" aria-selected="false" aria-controls="panel-mat" data-tab="mat" data-i18n="tabMat"></button>
    </div>

    <div class="panel" id="panel-svc" role="tabpanel">
    <p class="lead" data-i18n="lead"></p>

    <article>
      <img src="TechDraw.png" alt="">
      <div class="copy">
        <h2 data-i18n="t1"></h2>
        <p data-i18n="d1"></p>
        <p class="meta" data-i18n="m1"></p>
      </div>
    </article>
    <article>
      <img src="Scan.png" alt="">
      <div class="copy">
        <h2 data-i18n="t2"></h2>
        <p data-i18n="d2"></p>
        <p class="meta" data-i18n="m2"></p>
      </div>
    </article>
    <article>
      <img src="Geomerty.png" alt="">
      <div class="copy">
        <h2 data-i18n="t3"></h2>
        <p data-i18n="d3"></p>
        <p class="meta" data-i18n="m3"></p>
      </div>
    </article>
    <article>
      <img src="prototyp.png" alt="">
      <div class="copy">
        <h2 data-i18n="t4"></h2>
        <p data-i18n="d4"></p>
        <p class="meta" data-i18n="m4"></p>
      </div>
    </article>

    <div class="faq">
      <h2 data-i18n="faq"></h2>
      <details>
        <summary data-i18n="q1"></summary>
        <p data-i18n="a1"></p>
      </details>
      <details>
        <summary data-i18n="q2"></summary>
        <p data-i18n="a2"></p>
      </details>
      <details>
        <summary data-i18n="q3"></summary>
        <p data-i18n="a3"></p>
      </details>
      <details>
        <summary data-i18n="q4"></summary>
        <p data-i18n="a4"></p>
      </details>
    </div>

    <a class="cta" href="kontakt.html" data-i18n="cta"></a>
    </div>

    <div class="panel" id="panel-mat" role="tabpanel" hidden>
      <p class="lead" data-i18n="matLead"></p>
      <h2 data-i18n="fdm"></h2>
      <details id="pla-box">
        <summary>
          <span class="mat-name">PLA</span>
          <span class="mat-note" data-i18n="pla"></span>
        </summary>
        <div class="swatch" id="pla-swatch">
          <div class="fill" id="pla-fill"></div>
          <img src="filamente/filament.png" alt="Filament">
        </div>
        <p class="color-label" id="pla-label">Tannengrün</p>
        <div class="chips" id="pla-chips"></div>
      </details>
      <details id="petg-box">
        <summary>
          <span class="mat-name">PETG</span>
          <span class="mat-note" data-i18n="petg"></span>
        </summary>
        <div class="swatch" id="petg-swatch">
          <div class="fill" id="petg-fill"></div>
          <img src="filamente/filament.png" alt="Filament">
        </div>
        <p class="color-label" id="petg-label">Weiß</p>
        <div class="chips" id="petg-chips"></div>
      </details>
      <details id="tpu-box">
        <summary>
          <span class="mat-name">TPU</span>
          <span class="mat-note" data-i18n="tpu"></span>
        </summary>
        <div class="swatch" id="tpu-swatch">
          <div class="fill" id="tpu-fill"></div>
          <img src="filamente/filament.png" alt="Filament">
        </div>
        <p class="color-label" id="tpu-label">Digitalblau</p>
        <div class="chips" id="tpu-chips"></div>
      </details>
      <a class="cta" href="kontakt.html" data-i18n="cta"></a>
    </div>
  </main>
  <footer>
    <a href="impressum.html" data-i18n="imprint"></a>
    <a href="datenschutz.html" data-i18n="privacy"></a>
  </footer>
  <script>
    const T = {
      de: {
        back: "← Zurück",
        title: "Leistungen",
        lead: "TinkerVision konstruiert, digitalisiert und bereitet Geometrie so auf, dass sie sich fertigen lässt — Druck, Zerspanung oder Gravur. Fertige Modelle liegen zusätzlich in den Shops.",
        t1: "Technische Zeichnungen",
        d1: "Ableitung und Aufbereitung von Fertigungszeichnungen aus dem 3D-Modell: Ansichten, Schnitte, Bemaßung, Toleranzen soweit für das Bauteil nötig. Geeignet als Grundlage für Werkstatt, Lieferanten oder Dokumentation.",
        m1: "Typisch: PDF und die zugehörige CAD-Datei. Ausgang oft eine Skizze, ein bestehendes Modell oder ein Scan.",
        t2: "3D-Scans",
        d2: "Erfassung vorhandener Teile mit aktuellem Creality CR-Scan Otter, danach Bereinigung und Überführung in ein nutzbares Modell. Sinnvoll bei Ersatzteilen ohne Zeichnung, Reverse Engineering oder Passung an ein bestehendes Gehäuse.",
        m2: "Typisch kleine bis mittelgroße Objekte; glänzende oder sehr dunkle Flächen ggf. mattieren. Ergebnis: Netz oder daraus abgeleitetes CAD. Genauigkeit hängt von Größe, Oberfläche und Nutzung ab — im Zweifel Fotos und Maße mitschicken.",
        t3: "Parametrische 3D-Dateien",
        d3: "Konstruktion oder Nachbau als editierbares Modell, ausgelegt auf den Folgeprozess: 3D-Druck FDM und SLA, 3-Achs-CNC, Lasergravur. Parameter bleiben erhalten, wo das Zielformat das zulässt.",
        m3: "Export je nach Bedarf: STEP, IGES, STL, 3MF, OBJ, 3D-PDF, DXF, SVG, DWG — weitere gängige Formate auf Anfrage. Wandstärke, Toleranz und Ausrichtung werden mitgedacht.",
        t4: "Vom Prototyp zum Produkt",
        d4: "Begleitung vom ersten funktionsfähigen Stand bis zu einer fertigungstauglichen Version. Physische Muster auf Anfrage: FDM, SLA und 3-Achs-CNC. Nicht jeder Auftrag endet im Teil — oft reicht die lieferfertige Datei.",
        m4: "Ob Datei, Druck oder Fräsung, steht mit dem Auftrag fest. Fertige Downloads liegen parallel in den Shops.",
        faq: "Häufige Fragen",
        q1: "Was muss ich zur Anfrage mitschicken?",
        a1: "Kurz das Ziel (passt, ersetzt, wird gedruckt, wird gefräst), vorhandene Dateien oder Fotos, ungefähre Größe und Werkstoff, plus Termin wenn es einen gibt. Unvollständige Angaben sind in Ordnung — Nachfragen kommen über das Kontaktformular.",
        q2: "Welche Dateiformate bekomme ich?",
        a2: "Was der Folgeprozess braucht. Üblich: STEP und IGES für CAD-Weitergabe, STL und 3MF für Druck, OBJ, DXF/SVG/DWG für 2D und Laser, Zeichnung als PDF. Weitere gängige Formate auf Anfrage.",
        q3: "Ist das dasselbe wie die Shop-Modelle?",
        a3: "Nein. Cults3D und Printables sind fertige Downloads. Die Leistungen hier sind Aufträge: eigenes Teil, Scan, Zeichnung oder Anpassung. Shop-Dateien eignen sich, wenn ein vorhandenes Modell reicht.",
        q4: "Wie läuft ein Auftrag ab — und was kostet es?",
        a4: "Anfrage über Kontakt, Klärung von Umfang und Lieferumfang, Konstruktion oder Scan, Freigabe, danach Dateien und — falls gewünscht — Prototyp in FDM, SLA oder 3-Achs-CNC. Preise ausschließlich auf Anfrage. Änderungen nach der Freigabe sind ein neuer Schritt.",
        cta: "Anfrage senden",
        tabSvc: "Leistungen",
        tabMat: "Materialien",
        matLead: "Folgende Filamente stehen aktuell für das Prototyping zur Verfügung. Bei Bedarf bitte in der Anfrage angeben.",
        fdm: "FDM — Filamente",
        pla: "Für Anschauungsstücke, Passproben und Teile, die vor allem gut aussehen sollen. Steif und detailreich — nicht für starke Hitze, Stöße oder dauerhaftes Draußen.",
        petg: "Für Teile, die etwas aushalten: Gehäuse, Halter, Alltagsgegenstände. Zäher als PLA, verträgt Feuchte und viele Haushaltsstoffe besser.",
        tpu: "Für alles, das sich biegen oder federn soll: Dichtungen, Puffer, Clips, weiche Auflagen. Härte je nach Sorte — in der Anfrage sagen, wie weich das Teil sein soll.",
        imprint: "Impressum",
        privacy: "Datenschutz"
      },
      en: {
        back: "← Back",
        title: "Services",
        lead: "TinkerVision designs, digitises and prepares geometry so it can be made — print, machining or engraving. Ready-made models also live in the shops.",
        t1: "Technical drawings",
        d1: "Manufacturing drawings derived from the 3D model: views, sections, dimensions and tolerances as the part requires. Used as a brief for a workshop, a supplier or documentation.",
        m1: "Typical delivery: PDF plus the related CAD file. Input is often a sketch, an existing model or a scan.",
        t2: "3D scans",
        d2: "Capture of existing parts with a current Creality CR-Scan Otter, then cleanup and conversion into a usable model. Useful for spare parts without drawings, reverse engineering or fitting to an existing housing.",
        m2: "Typically small to mid-size objects; glossy or very dark surfaces may need matting. Output: a mesh or CAD derived from it. Accuracy depends on size, surface and use — send photos and dimensions if unsure.",
        t3: "Parametric 3D files",
        d3: "Design or rebuild as an editable model, aimed at the next process: FDM and SLA printing, 3-axis CNC, laser engraving. Parameters are kept where the target format allows.",
        m3: "Exports as needed: STEP, IGES, STL, 3MF, OBJ, 3D-PDF, DXF, SVG, DWG — other common formats on request. Wall thickness, tolerance and orientation are designed in.",
        t4: "From prototype to product",
        d4: "From a first working version to a manufacturable one. Physical samples on request: FDM, SLA and 3-axis CNC. Not every job ends as a part — often the deliverable is the file.",
        m4: "File, print or milling is fixed with the brief. Ready-made downloads also sit in the shops.",
        faq: "Common questions",
        q1: "What should I send with an enquiry?",
        a1: "The goal in one line (fit, replace, print, machine), any files or photos, rough size and material, and a deadline if there is one. Incomplete briefs are fine — follow-up goes through the contact form.",
        q2: "Which file formats do I receive?",
        a2: "Whatever the next process needs. Typical: STEP and IGES for CAD hand-off, STL and 3MF for printing, OBJ, DXF/SVG/DWG for 2D and laser, drawings as PDF. Other common formats on request.",
        q3: "Is this the same as the shop models?",
        a3: "No. Cults3D and Printables are ready downloads. The services here are commissions: your part, a scan, a drawing or an adaptation. Use the shops when an existing model is enough.",
        q4: "How does a job run — and what does it cost?",
        a4: "Enquiry via contact, scope and deliverables agreed, design or scan, approval, then files and — if wanted — a prototype in FDM, SLA or 3-axis CNC. Prices on request only. Changes after approval are a new step.",
        cta: "Send an enquiry",
        tabSvc: "Services",
        tabMat: "Materials",
        matLead: "The following filaments are currently available for prototyping. Please name your choice in the enquiry.",
        fdm: "FDM — filaments",
        pla: "For display pieces, fit checks and parts that should look sharp. Stiff and detailed — not for high heat, knocks or permanent outdoor use.",
        petg: "For parts that need to take a bit of use: housings, brackets, everyday objects. Tougher than PLA and better with moisture and household chemicals.",
        tpu: "For parts that should bend or spring: seals, bumpers, clips, soft pads. Hardness depends on the grade — say in the enquiry how soft the part should feel.",
        imprint: "Imprint",
        privacy: "Privacy"
      }
    };
    function applyLang(lang) {
      const pack = T[lang] || T.de;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (pack[key]) el.textContent = pack[key];
      });
      document.querySelectorAll("[data-set-lang]").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.getAttribute("data-set-lang") === lang ? "true" : "false");
      });
      localStorage.setItem("tv-lang", lang);
    }
    const PETG = [
      { id: "weiss", nameDe: "Weiß", nameEn: "White", hex: "#EFF0F1" },
      { id: "black", nameDe: "Black", nameEn: "Black", hex: "#212721" },
      { id: "gelb", nameDe: "Gelb", nameEn: "Yellow", hex: "#F3E500" },
      { id: "rot", nameDe: "Rot", nameEn: "Red", hex: "#C8102E" },
      { id: "blau", nameDe: "Blau", nameEn: "Blue", hex: "#003594" },
      { id: "gruen", nameDe: "Grün", nameEn: "Green", hex: "#009639" },
      { id: "grau", nameDe: "Grau", nameEn: "Grey", hex: "#97999B" },
      { id: "purple", nameDe: "Purple", nameEn: "Purple", hex: "#6A6DCD" },
      { id: "orange", nameDe: "Orange", nameEn: "Orange", hex: "#FF7F32" },
      { id: "pink", nameDe: "Pink", nameEn: "Pink", hex: "#FB637E" },
      { id: "peanut", nameDe: "Peanut Brown", nameEn: "Peanut Brown", hex: "#A9754F" },
      { id: "lime", nameDe: "Lime Green", nameEn: "Lime Green", hex: "#78D64B" },
      { id: "himmel", nameDe: "Himmelblau", nameEn: "Sky blue", hex: "#7EC8E3" },
      { id: "orange-t", nameDe: "Orange Transparent", nameEn: "Transparent orange", hex: "#FFB36A", look: "translucent" },
      { id: "schwarz-g", nameDe: "Schwarz glänzend", nameEn: "Glossy black", hex: "#141414", look: "gloss" }
    ];
    function petgLang() {
      return document.documentElement.lang === "en" ? "en" : "de";
    }
    function petgLabel(color) {
      const name = petgLang() === "en" ? color.nameEn : color.nameDe;
      if (name) return name;
      return color.hex || "";
    }
    function setPetg(color) {
      const fill = document.getElementById("petg-fill");
      const label = document.getElementById("petg-label");
      fill.style.background = color.hex;
      label.textContent = petgLabel(color);
      document.querySelectorAll("#petg-chips button").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.dataset.id === color.id ? "true" : "false");
      });
    }
    const PLA = [
      { id: "tanne", nameDe: "Tannengrün", nameEn: "Fir green", hex: "#1F4D2B" },
      { id: "marmor", nameDe: "Marmor", nameEn: "Marble", hex: "#E6E1D8", look: "marble" },
      { id: "pla-schwarz", nameDe: "Schwarz", nameEn: "Black", hex: "#212721" },
      { id: "pla-weiss", nameDe: "Weiß", nameEn: "White", hex: "#EFF0F1" }
    ];
    function setPla(color) {
      const fill = document.getElementById("pla-fill");
      const label = document.getElementById("pla-label");
      fill.style.background = color.look === "marble"
        ? "linear-gradient(115deg, #f3f0ea 0%, #d9d4cb 40%, #efece6 55%, #c5bfb4 78%, #f7f5f1 100%)"
        : color.hex;
      label.textContent = petgLang() === "en" ? color.nameEn : color.nameDe;
      document.querySelectorAll("#pla-chips button").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.dataset.id === color.id ? "true" : "false");
      });
    }
    (function buildPla() {
      const wrap = document.getElementById("pla-chips");
      PLA.forEach((color) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.id = color.id;
        if (color.look) btn.classList.add(color.look);
        else btn.style.background = color.hex;
        btn.title = color.nameDe;
        btn.addEventListener("click", () => setPla(color));
        wrap.appendChild(btn);
      });
      setPla(PLA[0]);
    })();
    const TPU = [
      { id: "digitalblau", nameDe: "Digitalblau", nameEn: "Digital blue", hex: "#0057B8", shore: "95A" },
      { id: "airgreen", nameDe: "Air Green Flex", nameEn: "Air Green Flex", hex: "#4CAF6A", shore: "65–82A" },
      { id: "tpu-orange", nameDe: "Orange", nameEn: "Orange", hex: "#FF7F32", shore: "95A" }
    ];
    function tpuLabel(color) {
      const name = petgLang() === "en" ? color.nameEn : color.nameDe;
      return name + " · " + color.shore;
    }
    function setTpu(color) {
      const fill = document.getElementById("tpu-fill");
      const label = document.getElementById("tpu-label");
      fill.style.background = color.hex;
      label.textContent = tpuLabel(color);
      document.querySelectorAll("#tpu-chips button").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.dataset.id === color.id ? "true" : "false");
      });
    }
    (function buildTpu() {
      const wrap = document.getElementById("tpu-chips");
      TPU.forEach((color) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.id = color.id;
        btn.style.background = color.hex;
        btn.title = tpuLabel(color);
        btn.addEventListener("click", () => setTpu(color));
        wrap.appendChild(btn);
      });
      setTpu(TPU[0]);
    })();
    (function buildPetg() {
      const wrap = document.getElementById("petg-chips");
      PETG.forEach((color) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.id = color.id;
        if (color.look) btn.classList.add(color.look);
        else btn.style.background = color.hex;
        btn.title = petgLabel(color);
        btn.addEventListener("click", () => setPetg(color));
        wrap.appendChild(btn);
      });
      setPetg(PETG[0]);
    })();
    const start = localStorage.getItem("tv-lang") || (navigator.language || "de").slice(0, 2);
    applyLang(start === "en" ? "en" : "de");
    document.querySelectorAll("[data-set-lang]").forEach((btn) => {
      btn.addEventListener("click", () => {
        applyLang(btn.getAttribute("data-set-lang"));
        const id = document.querySelector("#petg-chips [aria-pressed='true']")?.dataset.id;
        setPetg(PETG.find((c) => c.id === id) || PETG[0]);
        const tid = document.querySelector("#tpu-chips [aria-pressed='true']")?.dataset.id;
        setTpu(TPU.find((c) => c.id === tid) || TPU[0]);
        const pid = document.querySelector("#pla-chips [aria-pressed='true']")?.dataset.id;
        setPla(PLA.find((c) => c.id === pid) || PLA[0]);
      });
    });
    function showTab(id) {
      const svc = id !== "mat";
      document.getElementById("panel-svc").hidden = !svc;
      document.getElementById("panel-mat").hidden = svc;
      document.getElementById("tab-svc").setAttribute("aria-selected", svc ? "true" : "false");
      document.getElementById("tab-mat").setAttribute("aria-selected", svc ? "false" : "true");
    }
    document.querySelectorAll("[data-tab]").forEach((btn) => {
      btn.addEventListener("click", () => showTab(btn.getAttribute("data-tab")));
    });
    if (location.hash === "#materialien" || location.hash === "#materials") showTab("mat");
  </script>
</body>
</html>
