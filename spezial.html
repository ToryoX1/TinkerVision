<!DOCTYPE html>
<html lang="de">
<head>
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("tv-theme") || "light");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinkerVision — Spezialanfertigungen</title>
  <link rel="icon" href="emblem.png">
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=orbitron:700|outfit:400,500,600" rel="stylesheet">
  <style>
    :root { --ink:#101114; --muted:#6d6f78; --line:#e4e5ea; --bg0:#ececf1; --card:rgba(255,255,255,.78); --card-solid:#fff; --card-border:#fff; --glow:#fff; --accent:#822ef5; }
    html[data-theme="dark"] { --ink:#f3f4f8; --muted:#9aa0ab; --line:#2c2e36; --bg0:#0e0f12; --card:rgba(22,24,29,.82); --card-solid:#1c1e24; --card-border:#2c2e36; --glow:#16181d; }
    * { box-sizing:border-box; }
    html,body { margin:0; padding:0; }
    body { font-family:Outfit,system-ui,sans-serif; color:var(--ink); min-height:100vh; display:flex; flex-direction:column; align-items:center; background:var(--bg0); background-image:radial-gradient(ellipse 70% 45% at 50% 0%, var(--glow) 0%, transparent 70%), linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size:auto,28px 28px,28px 28px; }
    .top { width:min(560px, calc(100% - 28px)); display:flex; justify-content:space-between; align-items:center; padding:16px 0 0; }
    .back { color:var(--muted); text-decoration:none; font-size:.88rem; }
    .tools { display:flex; align-items:center; gap:10px; }
    .ios-switch { position:relative; width:51px; height:31px; }
    .ios-switch input { opacity:0; width:0; height:0; }
    .ios-slider { position:absolute; inset:0; background:#e9e9eb; border-radius:31px; }
    .ios-slider:before { content:""; position:absolute; height:27px; width:27px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 3px 8px rgba(0,0,0,.18); }
    .ios-switch input:checked + .ios-slider { background:#34c759; }
    .ios-switch input:checked + .ios-slider:before { transform:translateX(20px); }
    .lang { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card-solid); }
    .lang button { font-family:Outfit,sans-serif; font-size:.7rem; letter-spacing:.1em; font-weight:600; border:0; background:transparent; color:var(--muted); padding:7px 12px; cursor:pointer; }
    .lang button[aria-pressed="true"] { background:var(--ink); color:#fff; }
    main { width:min(560px, calc(100% - 28px)); margin:14px auto 28px; background:var(--card); border:1px solid var(--card-border); border-radius:28px; padding:28px 22px 22px; box-shadow:0 24px 50px rgba(16,17,20,.08); }
    @media (min-width:900px) { .top, main { width:min(680px, calc(100% - 48px)); } }
    .brand { font-family:Orbitron,sans-serif; font-size:1.5rem; letter-spacing:.24em; font-weight:700; margin:0 0 10px; text-align:center; }
    h1 { font-family:Orbitron,sans-serif; font-size:.95rem; letter-spacing:.12em; margin:0; text-align:center; }
    .rule { width:28px; height:2px; background:var(--ink); margin:14px auto 18px; opacity:.22; border-radius:2px; }
    .lead { color:var(--muted); text-align:center; margin:0 0 14px; font-size:.95rem; }
    .facts { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:0 0 16px; color:var(--muted); font-size:.75rem; }
    .facts span { border:1px solid var(--line); border-radius:999px; padding:5px 10px; background:var(--card-solid); }
    a.item { display:grid; grid-template-columns:72px 1fr 16px; gap:14px; align-items:center; text-decoration:none; color:var(--ink); background:var(--card-solid); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:16px; padding:14px; }
    a.item:hover { transform:translateY(-2px); }
    .thumb { width:72px; height:72px; border-radius:12px; background:var(--card-solid); border:1px solid var(--line); display:grid; place-items:center; }
    strong { display:block; font-size:1rem; }
    span { display:block; color:var(--muted); font-size:.8rem; margin-top:3px; }
    footer { margin-top:auto; padding:8px 16px 28px; color:var(--muted); font-size:.75rem; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
    footer a { color:var(--muted); text-decoration:none; }
  </style>
</head>
<body>
  <div class="top">
    <a class="back" href="index.html" data-i18n="back"></a>
    <div class="tools">
      <label class="ios-switch"><input type="checkbox" data-theme-toggle><span class="ios-slider"></span></label>
      <div class="lang">
        <button type="button" data-set-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>
  <main>
    <p class="brand">TinkerVision</p>
    <h1 data-i18n="title"></h1>
    <div class="rule"></div>
    <p class="lead" data-i18n="lead"></p>
    <p class="facts"><span data-i18n="f1"></span><span data-i18n="f2"></span><span data-i18n="f3"></span></p>
    <a class="item" href="netzlehre.html">
      <div class="thumb" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="#822ef5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="30" cy="14" rx="9" ry="11" transform="rotate(-35 30 14)"/>
          <path d="M24 20 L10 40"/>
          <ellipse cx="18" cy="14" rx="9" ry="11" transform="rotate(35 18 14)"/>
          <path d="M24 20 L38 40"/>
        </svg>
      </div>
      <div>
        <strong data-i18n="p1"></strong>
        <span data-i18n="p1s"></span>
      </div>
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10 6l6 6-6 6-1.4-1.4L13.2 12 8.6 7.4 10 6z"/></svg>
    </a>
  </main>
  <footer>
    <span>© 2026 TinkerVision</span>
    <a href="impressum.html" data-i18n="imprint">Impressum</a>
    <a href="datenschutz.html" data-i18n="privacy">Datenschutz</a>
    <a href="agb.html" data-i18n="agb">AGB</a>
    <a href="widerruf.html" data-i18n="widerruf">Widerruf</a>
  </footer>
  <script>
    const T = {
      de: { back:"← Zurück", title:"Spezialanfertigungen", lead:"Konfigurierbare Einzelstücke. Preis steht fest, Anfrage direkt.", f1:"STL 7 €", f2:"Sonderanfertigung 20 €", f3:"Anfrage per Code", p1:"Tischtennis Netzlehre Vereinsedition", p1s:"15,25 cm Netzhöhe · Belagsdicke · Vereinsfarben", imprint:"Impressum", privacy:"Datenschutz", agb:"AGB", widerruf:"Widerruf" },
      en: { back:"← Back", title:"Custom products", lead:"Configurable one-offs. Fixed price, enquire direct.", f1:"STL €7", f2:"Custom €20", f3:"Enquiry by code", p1:"Table tennis net gauge club edition", p1s:"15.25 cm net height · rubber thickness · club colours", imprint:"Imprint", privacy:"Privacy", agb:"Terms", widerruf:"Withdrawal" }
    };
    function applyLang(lang) {
      const pack = T[lang] || T.de;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach((el) => { const k = el.getAttribute("data-i18n"); if (pack[k]) el.textContent = pack[k]; });
      document.querySelectorAll("[data-set-lang]").forEach((b) => b.setAttribute("aria-pressed", b.getAttribute("data-set-lang") === lang ? "true" : "false"));
      localStorage.setItem("tv-lang", lang);
    }
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("tv-theme", theme);
      document.querySelectorAll("[data-theme-toggle]").forEach((el) => el.checked = theme === "dark");
    }
    applyLang((localStorage.getItem("tv-lang") || "de") === "en" ? "en" : "de");
    applyTheme(localStorage.getItem("tv-theme") || "light");
    document.querySelectorAll("[data-set-lang]").forEach((b) => b.addEventListener("click", () => applyLang(b.getAttribute("data-set-lang"))));
    document.querySelectorAll("[data-theme-toggle]").forEach((el) => el.addEventListener("change", () => applyTheme(el.checked ? "dark" : "light")));
  </script>
</body>
</html>
