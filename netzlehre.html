<!DOCTYPE html>
<html lang="de">
<head>
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("tv-theme") || "light");</script>

  <style>
    :root { --ink:#101114; --muted:#6d6f78; --line:#e4e5ea; --bg0:#ececf1; --card:rgba(255,255,255,.78); --card-solid:#fff; --card-border:#fff; --glow:#fff; }
    html[data-theme="dark"] { --ink:#f3f4f8; --muted:#9aa0ab; --line:#2c2e36; --bg0:#0e0f12; --card:rgba(22,24,29,.82); --card-solid:#1c1e24; --card-border:#2c2e36; --glow:#16181d; }
    * { box-sizing:border-box; }
    html,body { margin:0; padding:0; }
    body { font-family:Outfit,system-ui,sans-serif; color:var(--ink); min-height:100vh; display:flex; flex-direction:column; align-items:center; background:var(--bg0); background-image:radial-gradient(ellipse 70% 45% at 50% 0%, var(--glow) 0%, transparent 70%), linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size:auto,28px 28px,28px 28px; }
    .top { width:min(560px, calc(100% - 28px)); display:flex; justify-content:space-between; align-items:center; padding:16px 0 0; }
    .back { color:var(--muted); text-decoration:none; font-size:.88rem; }
    .tools { display:flex; align-items:center; gap:10px; }
    .ios-switch { position:relative; width:51px; height:31px; }
    .ios-switch input { opacity:0; width:0; height:0; }
    .ios-slider { position:absolute; inset:0; background:#e9e9eb; border-radius:31px; }
    .ios-slider:before { content:""; position:absolute; height:27px; width:27px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 3px 8px rgba(0,0,0,.18); }
    .ios-switch input:checked + .ios-slider { background:#34c759; }
    .ios-switch input:checked + .ios-slider:before { transform:translateX(20px); }
    .lang { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card-solid); }
    .lang button { font-family:Outfit,sans-serif; font-size:.7rem; letter-spacing:.1em; font-weight:600; border:0; background:transparent; color:var(--muted); padding:7px 12px; cursor:pointer; }
    .lang button[aria-pressed="true"] { background:var(--ink); color:#fff; }
    main { width:min(560px, calc(100% - 28px)); margin:14px auto 28px; background:var(--card); border:1px solid var(--card-border); border-radius:28px; padding:24px 18px 20px; box-shadow:0 24px 50px rgba(16,17,20,.08); }
    @media (min-width:900px) { .top, main { width:min(720px, calc(100% - 48px)); } }
    .brand { font-family:Orbitron,sans-serif; font-size:1.35rem; letter-spacing:.22em; font-weight:700; margin:0 0 8px; text-align:center; }
    h1 { font-family:Orbitron,sans-serif; font-size:.82rem; letter-spacing:.08em; margin:0; text-align:center; }
    .rule { width:28px; height:2px; background:var(--ink); margin:12px auto 14px; opacity:.22; border-radius:2px; }
    .offer { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:0 0 14px; }
    .offer div { background:var(--card-solid); border:1px solid var(--line); border-radius:14px; padding:10px 8px; text-align:center; }
    .offer b { display:block; font-family:Orbitron,sans-serif; font-size:.78rem; letter-spacing:.04em; }
    .offer span { display:block; color:var(--muted); font-size:.68rem; margin-top:3px; line-height:1.3; }
    .code {
      display:inline-block; font-family:Orbitron,sans-serif; font-size:.92rem; letter-spacing:.08em;
      background:var(--ink); color:#fff; text-decoration:none; border-radius:999px; padding:10px 16px;
    }
    .code:hover { opacity:.88; }
    .code-hint { color:var(--muted); font-size:.75rem; margin:6px 0 0; }
    #fillA, #fillB, #abbr, #wish { transition: fill .5s cubic-bezier(.2,.7,.2,1); }
    #sweep { pointer-events: none; }
    .stage.pulse svg { animation: settle .5s ease; }
    @keyframes settle { 0% { transform: scale(.975); } 60% { transform: scale(1.012); } 100% { transform: scale(1); } }
    @keyframes wipe { 0% { transform: translateX(-30px); opacity: 0; } 18% { opacity: .45; } 100% { transform: translateX(230px); opacity: 0; } }
    svg { width:auto; height:300px; display:block; margin:0 auto; }
    .stage { background:radial-gradient(ellipse at 50% 30%, #fff 0%, #e7e8ee 70%); border:1px solid var(--line); border-radius:18px; padding:14px 18px 12px; margin:0 auto 6px; width:fit-content; }
    .stage svg { width:auto; height:300px; display:block; margin:0 auto; }
    html[data-theme="dark"] .stage { background:radial-gradient(ellipse at 50% 30%, #2a2d36 0%, #14161b 72%); }
    label { display:block; font-size:.78rem; letter-spacing:.04em; color:var(--muted); margin:12px 0 6px; }
    input[type="text"] {
      width:100%; font-family:Outfit,sans-serif; font-size:1rem; border:1px solid var(--line);
      border-radius:12px; padding:11px 12px; background:var(--card-solid); color:var(--ink);
    }
    .fonts { display:grid; grid-template-columns:1fr; gap:6px; }
    .fonts button {
      font-size:1.05rem; border:1px solid var(--line); background:var(--card-solid); color:var(--ink);
      border-radius:10px; padding:11px 8px; cursor:pointer; letter-spacing:.04em; line-height:1;
    }
    .fonts button[aria-pressed="true"] { background:var(--ink); color:#fff; }
    .modes, .opts { display:flex; gap:8px; flex-wrap:wrap; }
    .modes button, .opts button {
      font-family:Outfit,sans-serif; border:1px solid var(--line); background:var(--card-solid);
      color:var(--ink); border-radius:999px; padding:8px 12px; cursor:pointer; font-size:.82rem;
    }
    .modes button[aria-pressed="true"], .opts button[aria-pressed="true"] { background:var(--ink); color:#fff; }
    .colors { display:flex; flex-wrap:wrap; gap:8px; }
    .colors button {
      width:36px; height:36px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0;
    }
    .colors button[aria-pressed="true"] { outline:2px solid var(--ink); outline-offset:2px; }
    .color-row[hidden] { display:none; }
    .extra { margin-top:10px; }
    .qty { display:flex; align-items:center; gap:8px; }
    .qty button { width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--card-solid); color:var(--ink); font-size:1.1rem; cursor:pointer; }
    .qty strong { min-width:24px; text-align:center; }
    .price { margin-top:14px; padding:12px 14px; border-radius:14px; background:var(--card-solid); border:1px solid var(--line); }
    .price b { font-family:Orbitron,sans-serif; font-size:1.15rem; letter-spacing:.04em; }
    .price p { margin:4px 0 0; color:var(--muted); font-size:.78rem; }
    .note { margin:14px 0 0; text-align:center; font-size:.72rem; color:var(--muted); }
    .qty + .note { margin:6px 0 0; text-align:left; }
    .note a { color:var(--muted); }
    footer { margin-top:auto; padding:8px 16px 28px; color:var(--muted); font-size:.75rem; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
    footer a { color:var(--muted); text-decoration:none; }
  </style>
</head>

  <script>
    const T = {
      de: { back:"← Zurück", title:"Netzlehre Vereinsedition", o1:"ab 7 €", o1s:"STL · Sonderanfertigung 20 €", o2:"Frei konfigurierbar", o2s:"2 oder 3 Farben · 4 Schriften", o3:"Jetzt anfragen", o3s:"Konfiguration per Code", hint:"Code anklicken öffnet die Anfrage mit dieser Kennung.", mode:"Farben", m2:"2 Farben", m3:"3 Farben", c1:"Farbe 1 · Lehre", c2:"Farbe 2 · Text", c3:"Farbe 3 · Text", wish:"Text · lange Seite", font:"Schrift", opt:"Lieferung", optS:"Nur STL · 7 €", optP:"Sonderanfertigung · 20 €", optB:"Sonderanfertigung & STL · +3,60 €", qty:"Anzahl", qtyNote:"Max. 8 pro Bestellung, gepolsterter Maxibrief.", region:"Versandregion", regionOther:"Andere Region", terms:"Bestätigung bis 48 Std. Digitale Datei in 3 Tagen. Kleinserie 14 Tage zzgl. Versand. Geringfügige Abweichungen im üblichen Rahmen.", fn:"Nicht ITTF-zugelassen", imprint:"Impressum", privacy:"Datenschutz", agb:"AGB", widerruf:"Widerruf",
        subj:"Netzlehre", body:(c,n)=>`Kennung: ${c}\nProdukt: Tischtennis Netzlehre Vereinsedition\n${n}` },
      en: { back:"← Back", title:"Net gauge club edition", o1:"from €7", o1s:"STL · custom €20", o2:"Free config", o2s:"2 or 3 colours · 4 typefaces", o3:"Send enquiry", o3s:"Configuration by code", hint:"Click the code to open the enquiry with this ID.", mode:"Colours", m2:"2 colours", m3:"3 colours", c1:"Colour 1 · gauge", c2:"Colour 2 · text", c3:"Colour 3 · text", wish:"Text · long side", font:"Typeface", opt:"Delivery", optS:"STL only · €7", optP:"Custom piece · €20", optB:"Custom piece & STL · +€3.60", qty:"Quantity", qtyNote:"Max. 8 per order, padded large letter.", region:"Shipping region", regionOther:"Other region", terms:"Confirmation within 48 hours. Digital file in 3 days. Small run 14 days plus shipping. Minor deviations within the usual range.", fn:"Not ITTF approved", imprint:"Imprint", privacy:"Privacy", agb:"Terms", widerruf:"Withdrawal",
        subj:"Net gauge", body:(c,n)=>`Code: ${c}\nProduct: table tennis net gauge club edition\n${n}` }
    };
    const FONTS = [
      { id:"OR", name:"Orbitron", css:"Orbitron, sans-serif" },
      { id:"OS", name:"Oswald", css:"Oswald, sans-serif" },
      { id:"BB", name:"Bebas", css:"'Bebas Neue', sans-serif" },
      { id:"AN", name:"Anton", css:"Anton, sans-serif" }
    ];
    let DB, lang = "de", mode = "2", c1 = "BK", c2 = "WH", c3 = "RD", opt = "S", font = "OR", qty = 1, region = "DE";
    function euro(n) {
      return (lang === "en" ? "€" : "") + n.toFixed(2).replace(".", lang === "en" ? "." : ",") + (lang === "en" ? "" : " €");
    }
    function quote() {
      if (opt === "S") return { total: 7, note: lang === "en" ? "STL file, no shipping" : "STL-Datei, kein Versand" };
      const goods = 20 + Math.max(0, qty - 1) * 2 + (opt === "B" ? 3.6 : 0);
      const ship = region === "DE" ? 2.9 : region === "EU" ? 6.5 : null;
      const bits = [`${qty}× ${euro(20)}`];
      if (qty > 1) bits.push(`+${qty - 1}× ${euro(2)}`);
      if (opt === "B") bits.push(lang === "en" ? "+ STL 3.60" : "+ STL 3,60");
      const shipName = region === "DE" ? (lang === "en" ? "shipping DE" : "Versand DE") : (lang === "en" ? "shipping EU" : "Versand EU");
      if (ship == null) return { total: goods, note: bits.join(" · ") + (lang === "en" ? " · shipping by region" : " · Versand je nach Region") };
      return { total: goods + ship, note: bits.join(" · ") + ` · ${shipName} ${euro(ship)}` };
    }
    function applyLang(next) {
      lang = next === "en" ? "en" : "de";
      const pack = T[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach((el) => { const k = el.getAttribute("data-i18n"); if (pack[k]) el.textContent = pack[k]; });
      document.querySelectorAll("[data-set-lang]").forEach((b) => b.setAttribute("aria-pressed", b.getAttribute("data-set-lang") === lang ? "true" : "false"));
      localStorage.setItem("tv-lang", lang);
      render();
    }
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("tv-theme", theme);
      document.querySelectorAll("[data-theme-toggle]").forEach((el) => el.checked = theme === "dark");
    }
    function hex(id) { return DB.colors[id].hex; }
    function name(id) { return DB.colors[id][lang]; }
    function codeOf() {
      return mode === "3" ? `NL3-${c1}-${c2}-${c3}-${font}-${opt}` : `NL2-${c1}-${c2}-${font}-${opt}`;
    }
    function fit(el, text) {
      el.textContent = text;
      const target = 1100;
      let size = 78;
      el.setAttribute("font-size", size);
      const len = () => el.getComputedTextLength() || 1;
      while (size > 22 && len() > target) { size -= 1; el.setAttribute("font-size", size); }
    }
    function paint() {
      const a = hex(c1);
      const b = mode === "3" ? hex(c2) : hex(c1);
      const t = mode === "3" ? hex(c3) : hex(c2);
      const face = FONTS.find((f) => f.id === font) || FONTS[0];
      document.getElementById("fillA").setAttribute("fill", a);
      document.getElementById("fillB").setAttribute("fill", b);
      const wish = document.getElementById("wish");
      wish.setAttribute("fill", t);
      wish.setAttribute("font-family", face.css);
      fit(wish, document.getElementById("wish-in").value || "Tv DEIN VEREIN 2026");
    }
    function renderFonts() {
      const box = document.getElementById("fonts");
      box.innerHTML = "";
      FONTS.forEach((f) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Tv DEIN VEREIN 2026";
        btn.style.fontFamily = f.css;
        btn.style.fontSize = "1.15rem";
        btn.setAttribute("aria-pressed", f.id === font ? "true" : "false");
        btn.addEventListener("click", () => { font = f.id; render(); });
        box.appendChild(btn);
      });
    }
    function renderColors() {
      const ids = Object.keys(DB.colors);
      ["c1", "c2", "c3"].forEach((slot) => {
        const box = document.getElementById(slot);
        const cur = slot === "c1" ? c1 : slot === "c2" ? c2 : c3;
        box.innerHTML = "";
        ids.forEach((id) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.title = name(id);
          btn.style.background = hex(id);
          btn.setAttribute("aria-pressed", id === cur ? "true" : "false");
          btn.addEventListener("click", () => {
            if (slot === "c1") c1 = id;
            else if (slot === "c2") c2 = id;
            else c3 = id;
            render();
          });
          box.appendChild(btn);
        });
      });
      document.getElementById("c3-row").hidden = mode !== "3";
      const pack = T[lang];
      document.querySelector("[data-i18n='c2']").textContent = mode === "3" ? (lang === "en" ? "Colour 2 · right" : "Farbe 2 · rechts") : pack.c2;
    }
    function render() {
      if (!DB) return;
      paint();
      renderColors();
      renderFonts();
      const code = codeOf();
      const detail = mode === "3"
        ? `${name(c1)} / ${name(c2)} / ${name(c3)}`
        : `${name(c1)} / ${name(c2)}`;
      const wish = document.getElementById("wish-in").value || "Tv DEIN VEREIN 2026";
      const optName = DB.options[opt][lang];
      const q = quote();
      document.getElementById("extra").hidden = opt === "S";
      document.getElementById("qty-val").textContent = String(qty);
      document.getElementById("price").textContent = opt !== "S" && region === "XX"
        ? euro(q.total) + (lang === "en" ? " + shipping" : " zzgl. Versand")
        : euro(q.total);
      document.getElementById("price-note").textContent = q.note;
      const note = `${detail}\nText: ${wish}\nSchrift: ${FONTS.find((f)=>f.id===font).name}\nOption: ${optName}\nAnzahl: ${opt === "S" ? 1 : qty}\nRegion: ${opt === "S" ? "—" : region}\nPreis: ${euro(q.total)}\n${q.note}`;
      const pack = T[lang];
      const subject = `${pack.subj} ${code}`;
      const message = pack.body(code, note);
      const link = document.getElementById("code");
      link.textContent = code;
      link.href = `kontakt.html?subject=${encodeURIComponent(subject)}&message=${encodeURIComponent(message)}`;
    }
    fetch("netzlehre-db.json").then((r) => r.json()).then((db) => {
      DB = db;
      applyLang((localStorage.getItem("tv-lang") || "de") === "en" ? "en" : "de");
    });
    applyTheme(localStorage.getItem("tv-theme") || "light");
    document.querySelectorAll("[data-set-lang]").forEach((b) => b.addEventListener("click", () => applyLang(b.getAttribute("data-set-lang"))));
    document.querySelectorAll("[data-theme-toggle]").forEach((el) => el.addEventListener("change", () => applyTheme(el.checked ? "dark" : "light")));
    document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => {
      mode = b.getAttribute("data-mode");
      document.querySelectorAll("[data-mode]").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      render();
    }));
    document.querySelectorAll("[data-opt]").forEach((b) => b.addEventListener("click", () => {
      opt = b.getAttribute("data-opt");
      document.querySelectorAll("[data-opt]").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      render();
    }));
    document.querySelectorAll("[data-region]").forEach((b) => b.addEventListener("click", () => {
      region = b.getAttribute("data-region");
      document.querySelectorAll("[data-region]").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      render();
    }));
    document.getElementById("qty-minus").addEventListener("click", () => { qty = Math.max(1, qty - 1); render(); });
    document.getElementById("qty-plus").addEventListener("click", () => { qty = Math.min(8, qty + 1); render(); });
    document.getElementById("wish-in").addEventListener("input", render);
  </script>
</body>
</html>
