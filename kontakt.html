<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinkerVision — Kontakt</title>
  <link rel="icon" href="emblem.png">
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=orbitron:700|outfit:400,500,600" rel="stylesheet">
  <style>
    :root {
      --ink: #101114;
      --muted: #6d6f78;
      --line: #e4e5ea;
      --bg0: #ececf1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--bg0);
      background-image:
        radial-gradient(ellipse 70% 45% at 50% 0%, #ffffff 0%, transparent 70%),
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: auto, 28px 28px, 28px 28px;
    }
    .top {
      width: min(528px, calc(100% - 28px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 0;
    }
    .back { color: var(--muted); text-decoration: none; font-size: 1.06rem; }
    .back:hover { color: var(--ink); }
    .lang {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.86);
    }
    .lang button {
      font-family: Outfit, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      font-weight: 600;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 12px;
      cursor: pointer;
    }
    .lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    main {
      width: min(528px, calc(100% - 28px));
      margin: 14px auto 28px;
      background: rgba(255,255,255,.78);
      border: 1px solid #fff;
      border-radius: 28px;
      padding: 34px 26px 26px;
      box-shadow: 0 24px 50px rgba(16,17,20,.08);
    }
    h1 {
      font-family: Orbitron, sans-serif;
      font-size: 1.14rem;
      letter-spacing: 0.18em;
      margin: 0 0 6px;
    }
    .lead { color: var(--muted); font-size: 1.06rem; margin: 0 0 22px; }
    label {
      display: block;
      font-size: 0.86rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 5px;
    }
    input, textarea {
      width: 100%;
      font-family: Outfit, sans-serif;
      font-size: 1.1rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 12px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }
    textarea { min-height: 132px; resize: vertical; }
    .actions { display: grid; gap: 8px; margin-top: 6px; }
    .btn-send {
      font-family: Outfit, sans-serif;
      font-weight: 700;
      font-size: 1.12rem;
      border: 0;
      border-radius: 12px;
      padding: 14px 17px;
      background: var(--ink);
      color: #fff;
      cursor: pointer;
    }
    .btn-mail {
      display: block;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 13px 17px;
      color: var(--muted);
    }
    .btn-mail:hover { color: var(--ink); }
    .sent {
      display: none;
      background: #e8f5ea;
      color: #1d6b2a;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    .sent.on { display: block; }
    .soon {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      border: 0;
      border-radius: 12px;
      overflow: hidden;
      min-height: 58px;
      padding: 0;
      cursor: default;
      position: relative;
      background: linear-gradient(135deg, #25d366 0 50%, #101114 50% 100%);
      color: #fff;
      font-family: Outfit, sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }
    .soon span {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 10px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .soon img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .soon img[src="X.png"] {
      width: 26px;
      height: 26px;
    }
    footer {
      margin-top: auto;
      padding: 4px 16px 28px;
      color: var(--muted);
      font-size: 0.75rem;
      display: flex;
      gap: 14px;
      justify-content: center;
    }
    footer a { color: var(--muted); text-decoration: none; }
  </style>
</head>
<body>
  <div class="top">
    <a class="back" href="index.html" data-i18n="back"></a>
    <div class="lang" role="group">
      <button type="button" data-set-lang="de" aria-pressed="true">DE</button>
      <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <main>
    <h1 data-i18n="title"></h1>
    <p class="lead" data-i18n="lead"></p>
    <p class="sent" id="sent" data-i18n="sent"></p>
    <form action="https://formsubmit.co/tinkervision.de@protonmail.com" method="POST">
      <input type="hidden" name="_subject" value="TinkerVision Kontakt">
      <input type="hidden" name="_next" value="https://tinkervision.de/kontakt.html?sent=1">
      <input type="hidden" name="_captcha" value="false">
      <input type="text" name="_honey" style="display:none">
      <label for="name" data-i18n="name"></label>
      <input id="name" name="name" required>
      <label for="email" data-i18n="email"></label>
      <input id="email" name="email" type="email" required>
      <label for="message" data-i18n="message"></label>
      <textarea id="message" name="message" required></textarea>
      <div class="actions">
        <button class="btn-send" type="submit" data-i18n="send"></button>
        <a class="btn-mail" href="mailto:tinkervision.de@protonmail.com" data-i18n="mailto"></a>
      </div>
    </form>
    <button class="soon" type="button" disabled aria-label="WhatsApp and X">
      <span><img src="whatsapp.png" alt=""> WhatsApp</span>
      <span><img src="X.png" alt=""> / Former Twitter</span>
    </button>
  </main>
  <footer>
    <a href="impressum.html" data-i18n="imprint"></a>
    <a href="datenschutz.html" data-i18n="privacy"></a>
  </footer>
  <script>
    const T = {
      de: {
        back: "← Zurück",
        title: "Kontakt",
        lead: "Idee, Auftrag oder Frage — kurz schreiben.",
        name: "Name",
        email: "E-Mail",
        message: "Nachricht",
        send: "Absenden",
        mailto: "Direkt an tinkervision.de@protonmail.com",
        sent: "Nachricht unterwegs. Bitte beim ersten Mal den Bestätigungslink in Proton Mail öffnen.",
        imprint: "Impressum",
        privacy: "Datenschutz"
      },
      en: {
        back: "← Back",
        title: "Contact",
        lead: "Idea, commission or question — drop a line.",
        name: "Name",
        email: "Email",
        message: "Message",
        send: "Send",
        mailto: "Email tinkervision.de@protonmail.com",
        sent: "Message on its way. The first time, open the confirmation link in Proton Mail.",
        imprint: "Imprint",
        privacy: "Privacy"
      }
    };
    function applyLang(lang) {
      const pack = T[lang] || T.de;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (pack[key]) el.textContent = pack[key];
      });
      document.querySelectorAll("[data-set-lang]").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.getAttribute("data-set-lang") === lang ? "true" : "false");
      });
      localStorage.setItem("tv-lang", lang);
    }
    const start = localStorage.getItem("tv-lang") || (navigator.language || "de").slice(0, 2);
    applyLang(start === "en" ? "en" : "de");
    document.querySelectorAll("[data-set-lang]").forEach((btn) => {
      btn.addEventListener("click", () => applyLang(btn.getAttribute("data-set-lang")));
    });
    if (new URLSearchParams(location.search).get("sent") === "1") {
      document.getElementById("sent").classList.add("on");
    }
  </script>
</body>
</html>
